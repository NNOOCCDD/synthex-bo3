<title>SYNTHEX.VIP Menu Pages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
  /* Layout: the in-game menu frame (1220px, wider than tall) centred on a dark stage, page index below. Single dark look by design. */
  :root {
    color-scheme: dark;
    --stage:     #121214;
    --bg:        #1d1d1f;
    --chrome:    #252527;
    --panel:     #262628;
    --line:      #39393c;
    --edge:      #303033;
    --field:     #1f1f21;
    --raise:     #2f2f32;
    --text:      #d9d9db;
    --muted:     #8c8c90;
    --dim:       #5d5d61;
    --pink:      #d39cb2;
    --pink-deep: #a8708a;
    --pink-glow: #ff4fa6;
    --danger:    #e7a3a3;
    --font:      Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); color: var(--text); font-family: var(--font); font-size: 13px; padding-inline: 16px; padding-block: 24px 40px; }
  .wrap { max-width: 1220px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .topline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  .topline h1 { margin: 0; font-weight: 300; font-size: 20px; letter-spacing: .3px; }
  .topline h1 b { font-weight: 300; color: var(--pink); }
  .topline p { margin: 0; color: var(--muted); font-size: 12px; }

  .scroller { overflow-x: auto; border-radius: 6px; }
  .menu { width: 1220px; height: 540px; background: var(--bg); border: 1px solid #333336; border-radius: 6px; display: grid; grid-template-rows: 58px 1fr 70px; overflow: hidden; }

  .header { background: var(--chrome); border-bottom: 1px solid var(--pink-deep); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 40px; height: 40px; }
  .brand .word { font-size: 26px; font-weight: 300; letter-spacing: .5px; color: #e4e4e6; }
  .brand .word b { font-weight: 300; color: var(--pink); }
  .status { display: flex; gap: 8px; }
  .chip { background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chip strong { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip.live { color: var(--pink); border-color: #4a3540; }
  .chip.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink-glow); margin-right: 7px; box-shadow: 0 0 6px var(--pink-glow); vertical-align: 1px; }

  .body { display: grid; grid-template-columns: 180px 1fr; min-height: 0; }
  .side { background: var(--chrome); border-right: 1px solid var(--line); padding-top: 14px; overflow: hidden; }
  .side button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px 0 13px; color: var(--muted); border-left: 3px solid transparent; cursor: pointer; }
  .side button:hover { color: var(--text); }
  .side button:focus-visible { outline: 1px solid var(--pink); outline-offset: -1px; }
  .side button .ic { display: flex; opacity: .55; }
  .side button[aria-current="true"] { color: #fff; background: #303033; border-left-color: var(--pink); font-weight: 500; }
  .side button[aria-current="true"] .ic { opacity: .95; }
  .side svg { fill: none; stroke: #cfcfd2; stroke-width: 1.8; }
  .side svg.gun { fill: #cfcfd2; stroke: none; }

  .content { padding: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-content: start; overflow: hidden; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; }
  .card h3 { margin: 0; font-size: 13px; font-weight: 500; padding: 10px 12px 9px; border-bottom: 1px solid var(--line); color: #e6e6e8; }
  .rows { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 9px; }

  .row { position: relative; }
  .row.cursor::before { content: ""; position: absolute; left: -12px; right: -12px; top: -4px; bottom: -4px; background: rgba(211,156,178,.08); border-left: 2px solid var(--pink); }
  .row > * { position: relative; }
  .check { display: flex; align-items: center; gap: 9px; }
  .check .box { flex: none; width: 13px; height: 13px; border-radius: 2px; background: var(--field); border: 1px solid #3c3c40; }
  .check.on .box { background: var(--pink); border-color: var(--pink); box-shadow: inset 0 0 0 2px var(--panel); }
  .check.off { color: var(--muted); }
  .hint { color: var(--dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .label { margin-bottom: 6px; }
  .label span { color: var(--muted); }
  .slider { height: 6px; background: var(--field); border-radius: 3px; position: relative; border: 1px solid #2f2f32; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--pink-deep), var(--pink)); }
  .slider i::after { content: ""; position: absolute; right: -2px; top: -3px; width: 4px; height: 10px; background: #f1dbe4; border-radius: 1px; }
  .select { height: 24px; background: var(--field); border: 1px solid #333336; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--muted); font-size: 12px; }
  .select::after { content: "‹ ›"; color: var(--dim); letter-spacing: 2px; }
  .btn { height: 26px; background: var(--raise); border: 1px solid #3b3b3f; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; padding: 0 4px; }
  .btn.danger { color: var(--danger); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .stat { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  .list { display: flex; flex-direction: column; gap: 1px; margin: 0 -12px; }
  .list div { padding: 5px 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .list div.sel { color: #fff; background: #303033; box-shadow: inset 2px 0 0 var(--pink); }
  .list div small { color: var(--dim); font-size: 11px; }
  .note { color: var(--dim); font-size: 11px; line-height: 1.45; }
  .row.inline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row.inline .select { width: 116px; }
  .ovscreen { position: relative; height: 150px; border-radius: 4px; border: 1px solid #333336; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 80%, #3a3430 0%, #24211f 45%, #151415 100%); }
  .ovpanel { position: absolute; top: 6px; right: 6px; width: 112px; padding: 5px 6px 6px; background: rgba(29,29,31,.8); border: 1px solid #39393c; border-top: 1px solid var(--pink-deep); border-radius: 3px; display: flex; flex-direction: column; gap: 2px; }
  .ovhead { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 300; color: #e4e4e6; padding-bottom: 3px; margin-bottom: 1px; border-bottom: 1px solid #39393c; }
  .ovhead svg { width: 12px; height: 12px; }
  .ovhead b { font-weight: 300; color: var(--pink); }
  .ovrow { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); }
  .ovrow b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .ovtags { display: flex; gap: 3px; margin-top: 3px; }
  .ovtags i { font-style: normal; font-size: 7.5px; letter-spacing: .4px; color: var(--pink); border: 1px solid #4a3540; border-radius: 2px; padding: 0 3px; }
  .sw { display: flex; align-items: center; gap: 7px; color: var(--text); }
  .sw i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .preview { position: relative; height: 84px; margin: 0 -2px; border-radius: 4px; border: 1px solid #333336; overflow: hidden;
    background: linear-gradient(180deg, #2a2b30 0%, #1b1b1e 60%, #141416 100%); }
  .preview::before { content: ""; position: absolute; left: 0; right: 0; top: 62%; height: 1px; background: #3a3a3e; }
  .mk { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .mk b { width: 10px; height: 10px; background: var(--c); transform: rotate(45deg); box-shadow: 0 0 8px var(--c); }
  .mk.far b { width: 7px; height: 7px; opacity: .7; }
  .mk.boss b { width: 13px; height: 13px; }
  .mk span { font-size: 10px; color: #e9e9eb; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  .edge { position: absolute; right: 4px; top: 18%; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid var(--c); filter: drop-shadow(0 0 4px var(--c)); }

  .nav { background: var(--chrome); border-top: 1px solid var(--line); display: grid; grid-template-columns: 260px 1fr 260px; align-items: center; padding: 0 14px; }
  .keys { color: var(--dim); font-size: 11px; line-height: 19px; white-space: nowrap; }
  .keys kbd { font-family: inherit; color: var(--muted); background: var(--field); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-right: 3px; }
  .tabs { display: flex; justify-content: center; gap: 4px; }
  .tabs button { all: unset; box-sizing: border-box; width: 76px; height: 56px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .tabs button:hover { color: var(--text); }
  .tabs button:focus-visible { outline: 1px solid var(--pink); }
  .tabs svg { width: 22px; height: 22px; fill: none; stroke: #9a9a9e; stroke-width: 1.7; }
  .tabs button[aria-current="true"] { background: #303033; color: #fff; font-weight: 500; }
  .tabs button[aria-current="true"] svg { stroke: var(--pink); }
  .mode { all: unset; box-sizing: border-box; justify-self: end; width: 84px; height: 56px; border: 1px solid #45454a; background: #2c2c2f; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; cursor: pointer; }
  .mode:hover { border-color: var(--pink-deep); }
  .mode:focus-visible { outline: 1px solid var(--pink); }
  .mode svg { width: 26px; height: 26px; }

  .index { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .group { background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: 12px; min-width: 0; }
  .group h2 { margin: 0 0 8px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .group .pages { display: flex; flex-wrap: wrap; gap: 6px; }
  .group button { all: unset; cursor: pointer; font-size: 12px; padding: 4px 9px; border-radius: 3px; background: var(--field); border: 1px solid var(--line); color: var(--text); }
  .group button:hover { border-color: var(--pink-deep); }
  .group button:focus-visible { outline: 1px solid var(--pink); }
  .group button[aria-current="true"] { border-color: var(--pink); color: var(--pink); }
  .modeswitch { display: flex; gap: 6px; }
  .modeswitch button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--field); color: var(--muted); font-size: 12px; }
  .modeswitch button[aria-pressed="true"] { color: #fff; border-color: var(--pink); }
  .modeswitch button:focus-visible { outline: 1px solid var(--pink); }
</style>

<div class="wrap">
  <div class="topline">
    <h1>SYNTHEX<b>.VIP</b> menu pages</h1>
    <div class="modeswitch" role="group" aria-label="Game mode">
      <button id="m-zm" type="button">Zombies</button>
      <button id="m-mp" type="button">Multiplayer</button>
    </div>
    <p id="count"></p>
  </div>

  <div class="scroller">
    <div class="menu">
      <div class="header">
        <div class="brand"><span id="logo-head"></span><div class="word">SYNTHEX<b>.VIP</b></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="body">
        <nav class="side" id="side" aria-label="Section"></nav>
        <div class="content" id="content"></div>
      </div>
      <div class="nav">
        <div class="keys"><kbd>Q</kbd><kbd>E</kbd> tabs &nbsp; <kbd>W</kbd><kbd>S</kbd> move<br><kbd>A</kbd><kbd>D</kbd> side / value &nbsp; <kbd>F</kbd> select &nbsp; <kbd>V</kbd> back</div>
        <nav class="tabs" id="tabs" aria-label="Tabs"></nav>
        <button class="mode" id="modebadge" type="button" aria-label="Switch game mode"></button>
      </div>
    </div>
  </div>

  <div class="index" id="index"></div>
</div>

<script>
const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><mask id="zcut"><rect width="64" height="64" fill="#fff"/><path d="M15 29 L28 32 C27 37 23 39 20 38 C17 37 15 34 15 29 Z" fill="#000"/><path d="M49 29 L36 32 C37 37 41 39 44 38 C47 37 49 34 49 29 Z" fill="#000"/><path d="M32 39 L29.5 44.5 L34.5 44.5 Z" fill="#000"/><path d="M21 49 L24 51.5 L27 49 L30 51.5 L32 49.5 L34 51.5 L37 49 L40 51.5 L43 49 L43 51 L40 53.5 L37 51 L34 53.5 L32 51.5 L30 53.5 L27 51 L24 53.5 L21 51 Z" fill="#000"/><path d="M37 19 L42 27" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><path d="M37.2 23.6 L40.6 21.4 M39.2 26.6 L42.6 24.4" stroke="#000" stroke-width="1.3" stroke-linecap="round"/></mask></defs><path mask="url(#zcut)" fill="#e4e4e6" d="M12 26 L13 18 L18 19 L20 12 L26 15 L31 9 L35 14 L41 11 L44 17 L50 16 L52 26 C53 33 52 38 49 42 L48 53 C48 56 46 58 43 58 L21 58 C18 58 16 56 16 53 L15 42 C12 38 11 33 12 26 Z"/><g fill="#ff4fa6"><path d="M17.5 31.5 L26 33.5 C25 36 23 37 21 36.5 C19 36 17.5 34 17.5 31.5 Z"/><path d="M46.5 31.5 L38 33.5 C39 36 41 37 43 36.5 C45 36 46.5 34 46.5 31.5 Z"/></g></svg>`;

/* ---------- icons ---------- */

  bullet: '<path d="M5 19l7-7M12 12l4-8 4 4-8 4"/>',

/* weapon silhouettes (fill), 44x14 */
const G = {
  ar: '<path d="M1 6h7l1-2h14l2 2h12v2h-6l-1 1h-6l-2 4h-4l1-4H12l-2 4H6l1-4H1z"/>',

/* ---------- row helpers ---------- */
const C = (l, on, hint) => ({ t: 'check', l, on: !!on, hint });
const S = (l, v, p) => ({ t: 'slider', l, v, p });
const D = (l, v) => ({ t: 'select', l, v });
const B = (...b) => ({ t: 'btns', b });
const S1 = (l) => ({ t: 'btns', b: [l] });
const ST = (l, v) => ({ t: 'stat', l, v });
const L = (items, sel = 0) => ({ t: 'list', items, sel });
const N = (l) => ({ t: 'note', l });
const K = (l, v, hex) => ({ t: 'color', l, v, hex });
const card = (h, ...rows) => ({ h, rows });

/* ---------- weapon lists ---------- */
const W = {
  ar: ['KN-44', 'XR-2', 'HVK-30', 'ICR-1', 'Man-O-War', 'Sheiva', 'M8A7', 'Peacekeeper MK2'],
  smg: ['Kuda', 'VMP', 'Weevil', 'Vesper', 'Pharo', 'Razorback', 'HG 40', 'Bootlegger'],
  sg: ['KRM-262', '205 Brecci', 'Haymaker 12', 'Argus'],
  lmg: ['BRM', 'Dingo', 'Gorgon', '48 Dredge'],
  snp: ['Drakon', 'Locus', 'SVG-100'],
  pst: ['MR6', 'RK5', 'L-CAR 9', 'Marshal 16', 'Mauser C96', '1911'],
  lch: ['XM-53', 'BlackCell', 'L4 Siege'],
  ww: ['Ray Gun', 'Ray Gun Mark II', 'Thundergun', 'Wunderwaffe DG-2', 'Apothicon Servant', 'KT-4', 'Ragnarok DG-4', 'Wrath of the Ancients', 'GKZ-45 Mk3'],
  hero: ['Annihilator', 'Gravity Spikes', 'H.I.V.E.', 'Purifier', 'Scythe', 'Sparrow', 'Tempest', 'Ripper', 'War Machine'],
};
function weaponPage(key, title, mode) {
  const list = mode === 'zm' && key === 'lch' ? ['XM-53'] : W[key];
  const give = mode === 'zm'
    ? card('Give', B('Give', 'Give Upgraded'), C('Replace Current Weapon', 1), C('Switch To It', 1), C('Free (no points)', 1))
    : card('Give', B('Give', 'Give + Max Ammo'), C('Replace Current Weapon', 1), C('Switch To It', 1));
  const look = mode === 'zm'
    ? card('Pack-a-Punch', D('Alt Ammo', 'Random'), D('Camo', 'Pack-a-Punch Default'), N('Applies when you give the upgraded version.'))
    : card('Customise', D('Camo', 'Dark Matter'), D('Optic', 'None'), D('Attachments', '+ Extended Mags'), N('Camos and attachments only apply to base weapons.'));
  const loadout = mode === 'zm'
    ? card('Current Loadout', ST('Slot 1', 'KN-44'), ST('Slot 2', 'Ray Gun'), ST('Slot 3', 'Empty (Mule Kick)'), B('Drop Current', 'Take Current'))
    : card('Current Loadout', ST('Primary', 'KN-44'), ST('Secondary', 'MR6'), ST('Specialist', 'Annihilator'), B('Drop Current', 'Take Current'));
  return [[card(title, L(list), N(mode === 'zm' ? 'In game this list only shows weapons the current map has.' : 'In game this list comes from the weapon table.'))], [give], [look], [loadout]];
}

/* ---------- render ---------- */
const state = { mode: 'zm', tab: 'player', side: 'general' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rowHTML(r, cursor) {
  const cur = cursor ? ' cursor' : '';
  switch (r.t) {
    case 'check': return `<div class="row check ${r.on ? 'on' : 'off'}${cur}"><div class="box"></div>${esc(r.l)}${r.hint ? `<span class="hint">${esc(r.hint)}</span>` : ''}</div>`;
    case 'slider': return `<div class="row${cur}"><div class="label">${esc(r.l)} <span>- ${esc(r.v)}</span></div><div class="slider"><i style="width:${r.p}%"></i></div></div>`;
    case 'select': return `<div class="row${cur}"><div class="label">${esc(r.l)}</div><div class="select">${esc(r.v)}</div></div>`;
    case 'btns': {
      const cls = r.b.length === 1 ? '' : r.b.length === 3 ? 'btn-row three' : 'btn-row';
      const inner = r.b.map((b) => b.startsWith('!') ? `<div class="btn danger">${esc(b.slice(1))}</div>` : `<div class="btn">${esc(b)}</div>`).join('');
      return r.b.length === 1 ? `<div class="row${cur}">${inner}</div>` : `<div class="row ${cls}${cur}">${inner}</div>`;
    }
    case 'stat': return `<div class="stat"><span>${esc(r.l)}</span><b>${esc(r.v)}</b></div>`;
    case 'list': return `<div class="list">${r.items.map((it, i) => `<div class="${i === r.sel ? 'sel' : ''}">${esc(it)}${i === r.sel ? '<small>selected</small>' : ''}</div>`).join('')}</div>`;
    case 'note': return `<div class="note">${esc(r.l)}</div>`;
    case 'color': return `<div class="row inline${cur}"><span>${esc(r.l)}</span><div class="select"><span class="sw">${r.hex ? `<i style="background:${r.hex}"></i>` : ''}${esc(r.v)}</span></div></div>`;
    case 'overlay': {
      const rows = r.zm ? [['Round', '14'], ['Zombies Left', '27'], ['Points', '48,250'], ['Kills', '312'], ['Game Time', '41:07']]
                        : [['Score', '34 – 28'], ['Time Left', '07:42'], ['K / D', '24 / 3'], ['Streak', '1,150'], ['Specialist', '64%']];
      return `<div class="ovscreen" role="img" aria-label="Stats overlay preview in the top right corner of the game screen">
        <div class="ovpanel"><div class="ovhead">${LOGO}<span>SYNTHEX<b>.VIP</b></span></div>
        ${rows.map(([a, b]) => `<div class="ovrow"><span>${a}</span><b>${b}</b></div>`).join('')}
        <div class="ovtags"><i>GOD</i><i>AMMO</i>${r.zm ? '<i>ESP</i>' : ''}</div></div></div>`;
    }
    case 'preview': return `<div class="preview" role="img" aria-label="ESP preview: three zombie markers with labels">
      <div class="mk" style="left:22%;top:58%;--c:#ff4fa6"><b></b><span>Zombie · 12m</span></div>
      <div class="mk far" style="left:62%;top:40%;--c:#ff4fa6"><b></b><span>Zombie · 31m</span></div>
      <div class="mk boss" style="left:78%;top:70%;--c:#ff5a5a"><b></b><span>Margwa · 8m</span></div>
      <div class="edge" style="--c:#f2c14e"></div></div>`;
  }
  return '';
}

function render() {
  const tabs = spec(state.mode);
  let tab = tabs.find((t) => t.id === state.tab) || tabs[0];
  state.tab = tab.id;
  let side = tab.sides.find((s) => s.id === state.side) || tab.sides[0];
  state.side = side.id;
  const zm = state.mode === 'zm';

  $('logo-head').innerHTML = LOGO;
  $('status').innerHTML = zm
    ? '<div class="chip">Round <strong>14</strong></div><div class="chip">Points <strong>48,250</strong></div><div class="chip">Map <strong>Shadows of Evil</strong></div><div class="chip live">Offline · Host</div>'
    : '<div class="chip">Mode <strong>Team Deathmatch</strong></div><div class="chip">Score <strong>34 – 28</strong></div><div class="chip">Time <strong>07:42</strong></div><div class="chip live">Offline · Host</div>';

  $('tabs').innerHTML = tabs.map((t) => `<button type="button" data-tab="${t.id}" aria-current="${t.id === tab.id}"><svg viewBox="0 0 24 24">${t.icon}</svg>${esc(t.label)}</button>`).join('');
  $('side').innerHTML = tab.sides.map((s) => {
    const ic = s.gun ? `<svg class="gun" width="44" height="14" viewBox="0 0 44 14">${s.gun}</svg>` : `<svg width="18" height="18" viewBox="0 0 24 24">${s.icon}</svg>`;
    return `<button type="button" data-side="${s.id}" aria-current="${s.id === side.id}">${esc(s.label)}<span class="ic">${ic}</span></button>`;
  }).join('');

  let first = true;
  $('content').innerHTML = side.cols.map((col) => `<div class="col">${col.map((c) => `<div class="card"><h3>${esc(c.h)}</h3><div class="rows">${c.rows.map((r) => {
    const interactive = !['stat', 'note', 'list'].includes(r.t);
    const isCursor = first && interactive; if (isCursor) first = false;
    return rowHTML(r, isCursor);
  }).join('')}</div></div>`).join('')}</div>`).join('');

  $('modebadge').innerHTML = LOGO + (zm ? 'Zombies' : 'Multiplayer');
  $('m-zm').setAttribute('aria-pressed', zm);
  $('m-mp').setAttribute('aria-pressed', !zm);

  const total = tabs.reduce((n, t) => n + t.sides.length, 0);
  $('count').textContent = `${total} pages in ${zm ? 'Zombies' : 'Multiplayer'} · click any tab, side tab or page below`;
  $('index').innerHTML = tabs.map((t) => `<div class="group"><h2>${esc(t.label)}</h2><div class="pages">${t.sides.map((s) => `<button type="button" data-goto="${t.id}:${s.id}" aria-current="${t.id === tab.id && s.id === side.id}">${esc(s.label)}</button>`).join('')}</div></div>`).join('');
  try { localStorage.setItem('synthex-pages', JSON.stringify(state)); } catch (e) {}
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab) { state.tab = b.dataset.tab; state.side = ''; }
  else if (b.dataset.side) state.side = b.dataset.side;
  else if (b.dataset.goto) { const [t, s] = b.dataset.goto.split(':'); state.tab = t; state.side = s; }
  else if (b.id === 'modebadge') state.mode = state.mode === 'zm' ? 'mp' : 'zm';
  else if (b.id === 'm-zm') state.mode = 'zm';
  else if (b.id === 'm-mp') state.mode = 'mp';
  else return;
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  const tabs = spec(state.mode);
  const ti = tabs.findIndex((t) => t.id === state.tab);
  const sides = tabs[ti].sides; const si = sides.findIndex((s) => s.id === state.side);
  const k = e.key.toLowerCase();
  if (k === 'q' || k === 'e') { const n = tabs[(ti + (k === 'e' ? 1 : tabs.length - 1)) % tabs.length]; state.tab = n.id; state.side = ''; }
  else if (k === 'w' || k === 's') { state.side = sides[(si + (k === 's' ? 1 : sides.length - 1)) % sides.length].id; }
  else return;
  render();
});
try { Object.assign(state, JSON.parse(localStorage.getItem('synthex-pages') || '{}')); } catch (e) {}
render();
</script>
